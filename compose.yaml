x-customizable-image: &customizable_image
  # By default the image used only contains the `frappe` and `erpnext` apps.
  # See https://github.com/frappe/frappe_docker/blob/main/docs/container-setup/02-build-setup.md#define-custom-apps
  # about using custom images.
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  pull_policy: ${PULL_POLICY:-always}
  #  pull_policy: missing
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-ai-backend-environment: &ai_backend_environment
  MYAPP_AI_ORCHESTRATOR_URL: ${MYAPP_AI_ORCHESTRATOR_URL:-http://ai-orchestrator:4010}
  MYAPP_AI_SERVICE_TOKEN: ${MYAPP_AI_SERVICE_TOKEN:-local-development-ai-service-token}
  MYAPP_AI_VECTOR_SEARCH_ENABLED: ${MYAPP_AI_VECTOR_SEARCH_ENABLED:-0}
  MYAPP_AI_EMBEDDING_MODEL: ${MYAPP_AI_EMBEDDING_MODEL:-}
  MYAPP_AI_QDRANT_COLLECTION: ${MYAPP_AI_QDRANT_COLLECTION:-myapp-products-v1}
  MYAPP_AI_QDRANT_ALIAS: ${MYAPP_AI_QDRANT_ALIAS:-}
  MYAPP_AI_ENVIRONMENT: ${MYAPP_AI_ENVIRONMENT:-development}

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  #  extra_hosts:
  #    - "host.docker.internal:host-gateway"
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - ./apps/myapp:/home/frappe/frappe-bench/apps/myapp
    #    - ./.vscode:/home/frappe/frappe-bench/.vscode:cached

services:
  configurator:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    # add redis_socketio for backward compatibility
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -g workers '{"ai-vector":{"timeout":900}}' --parse;
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
      REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
      SOCKETIO_PORT: 9000
    depends_on: {}
    restart: on-failure

  backend:
    <<: *backend_defaults
    platform: linux/amd64
    ports:
      - "5678:5678"
      - "8000:8000"
    environment:
      <<: *ai_backend_environment
      ENABLE_PYCHARM_DEBUG: "1"
    entrypoint:
      - bash
      - -c
    command:
      - >
        mkdir -p /home/frappe/logs /home/frappe/frappe-bench/logs;
        ./env/bin/pip install -e apps/myapp;
        exec bench serve

  ai-orchestrator:
    build:
      context: ./services/myapp-ai
    restart: ${RESTART_POLICY:-unless-stopped}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - .env.ai.local
    volumes:
      - ./ai-governance-reports:/var/lib/myapp-ai/governance-reports:ro
    ports:
      - "127.0.0.1:${MYAPP_AI_ORCHESTRATOR_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-vector-init:
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /qdrant/storage/snapshots && chown -R 65534:65534 /qdrant/storage"]
    volumes:
      - ai-vector-data:/qdrant/storage

  ai-vector:
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "65534:65534"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ai-vector-data:/qdrant/storage
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ai-vector-init:
        condition: service_completed_successfully

  frontend:
    <<: *customizable_image
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      # - ./apps:/home/frappe/frappe-bench/apps
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *backend_defaults
    platform: linux/amd64
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    environment:
      <<: *ai_backend_environment
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        exec bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    environment:
      <<: *ai_backend_environment
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        exec bench worker --queue long,default,short

  queue-ai-vector:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    environment:
      <<: *ai_backend_environment
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        exec bench worker --queue ai-vector

  scheduler:
    <<: *backend_defaults
    platform: linux/amd64
    entrypoint:
      - bash
      - -c
    environment:
      <<: *ai_backend_environment
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        exec bench schedule

# ERPNext requires local assets access (Frappe does not)
volumes:
  sites:
  ai-vector-data:
