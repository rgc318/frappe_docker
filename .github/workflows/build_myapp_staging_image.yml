name: Build myapp staging image

on:
  workflow_dispatch:
    inputs:
      myapp_ref:
        description: "myapp branch, tag, or commit to build into the image"
        required: true
        default: "main"
        type: string
      frappe_ref:
        description: "frappe tag or commit to build from"
        required: true
        default: "v16.18.3"
        type: string
      erpnext_ref:
        description: "erpnext tag or commit to build into the image"
        required: true
        default: "v16.18.3"
        type: string
      image_tag:
        description: "image tag to publish"
        required: true
        default: "staging-latest"
        type: string
      push_latest:
        description: "also push :latest"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/myapp-erpnext
  AI_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/myapp-ai
  FRAPPE_PATH: https://github.com/frappe/frappe

jobs:
  build:
    name: Build and push staging image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v6

      - name: Create apps.staging.json
        run: |
          cat > deploy/staging/apps.staging.json <<EOF
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "${{ inputs.erpnext_ref }}"
            },
            {
              "url": "https://github.com/rgc318/myapp.git",
              "branch": "${{ inputs.myapp_ref }}"
            }
          ]
          EOF

      - name: Encode apps json
        id: apps_json
        run: |
          echo "value=$(base64 -w 0 deploy/staging/apps.staging.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=myapp staging image
            org.opencontainers.image.description=ERPNext image with myapp baked in for staging deployment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.rgc.frappe_docker_ref=${{ github.ref_name }}
            org.rgc.frappe_ref=${{ inputs.frappe_ref }}
            org.rgc.erpnext_ref=${{ inputs.erpnext_ref }}
            org.rgc.myapp_ref=${{ inputs.myapp_ref }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/myapp-staging/Containerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_BRANCH=${{ inputs.frappe_ref }}
            FRAPPE_PATH=${{ env.FRAPPE_PATH }}
            ERPNEXT_REF=${{ inputs.erpnext_ref }}
            MYAPP_REF=${{ inputs.myapp_ref }}
            APPS_JSON_BASE64=${{ steps.apps_json.outputs.value }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate AI image metadata
        id: ai_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AI_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=myapp AI orchestrator
            org.opencontainers.image.description=MyApp AI orchestration service for staging deployment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.rgc.frappe_docker_ref=${{ github.ref_name }}

      - name: Build and push AI orchestrator
        uses: docker/build-push-action@v6
        with:
          context: services/myapp-ai
          file: services/myapp-ai/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ai_meta.outputs.tags }}
          labels: ${{ steps.ai_meta.outputs.labels }}
