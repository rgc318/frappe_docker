name: Deploy staging stack

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published image tag to deploy"
        required: true
        default: "staging-latest"
        type: string
      site_name:
        description: "Site name for bench migrate"
        required: true
        default: "staging.example.com"
        type: string
      run_health_check:
        description: "Run check-staging.sh after deploy"
        required: true
        default: true
        type: boolean
      run_http_regression:
        description: "Run critical JWT/idempotency HTTP regression after deploy"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SERVER_PATH: /srv/frappe_docker

jobs:
  deploy:
    name: Deploy staging server
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RUN_HTTP_REGRESSION: ${{ inputs.run_http_regression }}
          STAGING_HTTP_USERNAME: ${{ secrets.STAGING_HTTP_USERNAME }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
          STAGING_HTTP_API_KEY: ${{ secrets.STAGING_HTTP_API_KEY }}
          STAGING_HTTP_API_SECRET: ${{ secrets.STAGING_HTTP_API_SECRET }}
          STAGING_HTTP_BEARER_TOKEN: ${{ secrets.STAGING_HTTP_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          missing=()

          for key in \
            STAGING_SSH_HOST \
            STAGING_SSH_PORT \
            STAGING_SSH_USER \
            STAGING_SSH_PRIVATE_KEY \
            GHCR_USERNAME \
            GHCR_TOKEN; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          if [ "${RUN_HTTP_REGRESSION}" = "true" ]; then
            if [ -z "${STAGING_HTTP_BEARER_TOKEN:-}" ]; then
              if [ -z "${STAGING_HTTP_API_KEY:-}" ] || [ -z "${STAGING_HTTP_API_SECRET:-}" ]; then
                if [ -z "${STAGING_HTTP_USERNAME:-}" ] || [ -z "${STAGING_HTTP_PASSWORD:-}" ]; then
                  echo "run_http_regression requires STAGING_HTTP_BEARER_TOKEN, or STAGING_HTTP_API_KEY/STAGING_HTTP_API_SECRET, or STAGING_HTTP_USERNAME/STAGING_HTTP_PASSWORD."
                  exit 1
                fi
              fi
            fi
          fi

          if ! printf '%s' "${STAGING_SSH_PORT}" | grep -Eq '^[0-9]+$'; then
            echo "STAGING_SSH_PORT must be digits only, without spaces or newlines."
            exit 1
          fi

          for key in STAGING_SSH_HOST STAGING_SSH_USER GHCR_USERNAME; do
            if printf '%s' "${!key}" | grep -Eq '[[:space:]]'; then
              printf '%s must not contain spaces or newlines.\n' "${key}"
              exit 1
            fi
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SITE_NAME: ${{ inputs.site_name }}
          DEPLOY_REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,SITE_NAME,DEPLOY_REF_NAME
          script: |
            set -euo pipefail
            cd /srv/frappe_docker

            if ! git ls-remote --exit-code --heads origin "${DEPLOY_REF_NAME}" >/dev/null; then
              echo "Deploy ref must be an existing branch: ${DEPLOY_REF_NAME}"
              exit 1
            fi

            git fetch --prune origin "${DEPLOY_REF_NAME}"
            if git show-ref --verify --quiet "refs/heads/${DEPLOY_REF_NAME}"; then
              git checkout "${DEPLOY_REF_NAME}"
            else
              git checkout -b "${DEPLOY_REF_NAME}" "origin/${DEPLOY_REF_NAME}"
            fi
            git pull --ff-only origin "${DEPLOY_REF_NAME}"

            if [ ! -f deploy/staging/staging.env ]; then
              echo "Missing deploy/staging/staging.env on server. Run ./deploy/staging/init-staging-server.sh first."
              exit 1
            fi

            if grep -q '^CUSTOM_TAG=' deploy/staging/staging.env; then
              sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" deploy/staging/staging.env
            else
              printf '\nCUSTOM_TAG=%s\n' "${IMAGE_TAG}" >> deploy/staging/staging.env
            fi

            if grep -q '^MYAPP_AI_TAG=' deploy/staging/staging.env; then
              sed -i "s/^MYAPP_AI_TAG=.*/MYAPP_AI_TAG=${IMAGE_TAG}/" deploy/staging/staging.env
            else
              printf '\nMYAPP_AI_TAG=%s\n' "${IMAGE_TAG}" >> deploy/staging/staging.env
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            SITE_NAME="${SITE_NAME}" ./deploy/staging/deploy-staging.sh

      - name: Run health check
        if: ${{ inputs.run_health_check }}
        uses: appleboy/ssh-action@v1.2.2
        env:
          RUN_STAGING_HTTP_REGRESSION: ${{ inputs.run_http_regression && '1' || '0' }}
          STAGING_HTTP_USERNAME: ${{ secrets.STAGING_HTTP_USERNAME }}
          STAGING_HTTP_PASSWORD: ${{ secrets.STAGING_HTTP_PASSWORD }}
          STAGING_HTTP_API_KEY: ${{ secrets.STAGING_HTTP_API_KEY }}
          STAGING_HTTP_API_SECRET: ${{ secrets.STAGING_HTTP_API_SECRET }}
          STAGING_HTTP_BEARER_TOKEN: ${{ secrets.STAGING_HTTP_BEARER_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: RUN_STAGING_HTTP_REGRESSION,STAGING_HTTP_USERNAME,STAGING_HTTP_PASSWORD,STAGING_HTTP_API_KEY,STAGING_HTTP_API_SECRET,STAGING_HTTP_BEARER_TOKEN
          script: |
            set -euo pipefail
            cd /srv/frappe_docker
            ./deploy/staging/check-staging.sh
