name: Deploy staging stack

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published image tag to deploy"
        required: true
        default: "staging-latest"
        type: string
      site_name:
        description: "Site name for bench migrate"
        required: true
        default: "staging.example.com"
        type: string
      run_health_check:
        description: "Run check-staging.sh after deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SERVER_PATH: /srv/frappe_docker

jobs:
  deploy:
    name: Deploy staging server
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          missing=()

          for key in \
            STAGING_SSH_HOST \
            STAGING_SSH_PORT \
            STAGING_SSH_USER \
            STAGING_SSH_PRIVATE_KEY \
            GHCR_USERNAME \
            GHCR_TOKEN; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SITE_NAME: ${{ inputs.site_name }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,SITE_NAME
          script: |
            set -euo pipefail
            cd /srv/frappe_docker
            git pull --ff-only origin main

            if [ ! -f deploy/staging/staging.env ]; then
              echo "Missing deploy/staging/staging.env on server. Run ./deploy/staging/init-staging-server.sh first."
              exit 1
            fi

            if grep -q '^CUSTOM_TAG=' deploy/staging/staging.env; then
              sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" deploy/staging/staging.env
            else
              printf '\nCUSTOM_TAG=%s\n' "${IMAGE_TAG}" >> deploy/staging/staging.env
            fi

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            SITE_NAME="${SITE_NAME}" ./deploy/staging/deploy-staging.sh

      - name: Run health check
        if: ${{ inputs.run_health_check }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /srv/frappe_docker
            ./deploy/staging/check-staging.sh
