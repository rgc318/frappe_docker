name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.6"

      # For shfmt pre-commit hook
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.14"

      - name: Install pre-commit
        run: pip install -U pre-commit

      - name: Reject tracked Frappe runtime configs and credential archives
        run: |
          python -m unittest discover -s deploy/security -p 'test_*.py'
          python deploy/security/check_tracked_secrets.py

      - name: Lint
        run: pre-commit run --color=always --all-files
        env:
          GO111MODULE: on
