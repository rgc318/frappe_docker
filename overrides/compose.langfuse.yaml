x-langfuse-runtime-env: &langfuse-runtime-env
  - .env.langfuse.runtime.local

services:
  ai-orchestrator:
    env_file:
      - .env.langfuse.gateway.local

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:${LANGFUSE_VERSION:-3.212.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on: &langfuse-dependencies
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    env_file: *langfuse-runtime-env

  langfuse-web:
    image: docker.io/langfuse/langfuse:${LANGFUSE_VERSION:-3.212.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    env_file: *langfuse-runtime-env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://'+process.env.HOSTNAME+':3000/api/public/health').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.6.1.1193}
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "101:101"
    env_file: *langfuse-runtime-env
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:8230f06574280781ea6ad45e27962db60175b18e4a43dd54c19012feb5438174}
    restart: ${RESTART_POLICY:-unless-stopped}
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    env_file: *langfuse-runtime-env
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  langfuse-redis:
    image: docker.io/redis:${LANGFUSE_REDIS_VERSION:-7.4.9}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    env_file: *langfuse-runtime-env
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 20

  langfuse-postgres:
    image: docker.io/postgres:${LANGFUSE_POSTGRES_VERSION:-17.10}
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file: *langfuse-runtime-env
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
