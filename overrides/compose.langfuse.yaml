x-langfuse-worker-environment: &langfuse-worker-environment
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
  DATABASE_URL: ${LANGFUSE_DATABASE_URL:?Run ./setup-ai-observability.sh first}
  DIRECT_URL: ${LANGFUSE_DATABASE_URL:?Run ./setup-ai-observability.sh first}
  SALT: ${LANGFUSE_SALT:?Run ./setup-ai-observability.sh first}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Run ./setup-ai-observability.sh first}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run ./setup-ai-observability.sh first}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Run ./setup-ai-observability.sh first}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Run ./setup-ai-observability.sh first}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Run ./setup-ai-observability.sh first}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_PUBLIC_URL:-http://localhost:9090}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_ENABLE_BLOB_STORAGE_FILE_LOG: "true"
  LANGFUSE_S3_EVENT_KEY_MAX_SEGMENT_BYTES: "255"
  AUTH_DISABLE_SIGNUP: "true"

services:
  ai-orchestrator:
    environment:
      MYAPP_AI_LANGFUSE_HOST: http://langfuse-web:3000
      MYAPP_AI_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?Run ./setup-ai-observability.sh first}
      MYAPP_AI_LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?Run ./setup-ai-observability.sh first}
      MYAPP_AI_LANGFUSE_ENVIRONMENT: ${MYAPP_AI_LANGFUSE_ENVIRONMENT:-development}
      MYAPP_AI_LANGFUSE_RELEASE: ${MYAPP_AI_LANGFUSE_RELEASE:-local}
      MYAPP_AI_LANGFUSE_CAPTURE_CONTENT: ${MYAPP_AI_LANGFUSE_CAPTURE_CONTENT:-0}
      MYAPP_AI_LANGFUSE_TIMEOUT_SECONDS: ${MYAPP_AI_LANGFUSE_TIMEOUT_SECONDS:-5}

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:${LANGFUSE_VERSION:-3.212.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on: &langfuse-dependencies
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: *langfuse-worker-environment

  langfuse-web:
    image: docker.io/langfuse/langfuse:${LANGFUSE_VERSION:-3.212.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-worker-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Run ./setup-ai-observability.sh first}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-myapp}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-MyApp}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-myapp-ai}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-MyApp-AI-Copilot}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?Run ./setup-ai-observability.sh first}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?Run ./setup-ai-observability.sh first}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@myapp.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-MyApp-AI-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Run ./setup-ai-observability.sh first}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://'+process.env.HOSTNAME+':3000/api/public/health').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.6.1.1193}
    restart: ${RESTART_POLICY:-unless-stopped}
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Run ./setup-ai-observability.sh first}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:8230f06574280781ea6ad45e27962db60175b18e4a43dd54c19012feb5438174}
    restart: ${RESTART_POLICY:-unless-stopped}
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?Run ./setup-ai-observability.sh first}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  langfuse-redis:
    image: docker.io/redis:${LANGFUSE_REDIS_VERSION:-7.4.9}
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:?Run ./setup-ai-observability.sh first}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_AUTH:?Run ./setup-ai-observability.sh first}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 20

  langfuse-postgres:
    image: docker.io/postgres:${LANGFUSE_POSTGRES_VERSION:-17.10}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Run ./setup-ai-observability.sh first}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
