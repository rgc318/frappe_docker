services:
  configurator:
    volumes:
      - ./.devcontainer/.cache/pip:/home/frappe/.cache/pip

  backend:
    # 1. 修复参数：'missing' 确保本地构建的镜像不被远程拉取干扰
    pull_policy: missing

    # 精准挂载调试配置。Dev Container 下保持 backend 容器常驻，
    # 由 VS Code launch.json/F5 启动 bench serve，避免 8000 端口被预占。
    volumes:
      - ./.vscode:/home/frappe/frappe-bench/.vscode:cached
      - /usr/share/fonts/opentype/noto:/home/frappe/.local/share/fonts/noto:ro
      - ./.devcontainer/.cache/pip:/home/frappe/.cache/pip

    entrypoint:
      - bash
      - -c
    command:
      - >
        ./env/bin/pip install -e apps/myapp;
        ./env/bin/python -c "import debugpy" >/dev/null 2>&1 || ./env/bin/pip install "debugpy>=1.8.20";
        tail -f /dev/null

    working_dir: /home/frappe/frappe-bench
    ports:
      - "8000:8000"
      - "5678:5678"

  queue-short:
    volumes:
      - /usr/share/fonts/opentype/noto:/home/frappe/.local/share/fonts/noto:ro
      - ./.devcontainer/.cache/pip:/home/frappe/.cache/pip

  queue-long:
    volumes:
      - /usr/share/fonts/opentype/noto:/home/frappe/.local/share/fonts/noto:ro
      - ./.devcontainer/.cache/pip:/home/frappe/.cache/pip

  scheduler:
    volumes:
      - ./.devcontainer/.cache/pip:/home/frappe/.cache/pip

  mobile-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:80"
    volumes:
      - ./dev/nginx/mobile-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev/nginx/probe.html:/usr/share/nginx/html/probe.html:ro
    depends_on:
      - frontend
