global
  log stdout format raw local0
  maxconn 4096
  stats socket /tmp/haproxy-admin.sock mode 660 level admin

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 300s
  timeout server 300s
  timeout http-request 15s

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold nx 1s
  hold other 1s
  hold refused 1s
  hold timeout 1s

frontend ai_runtime
  bind :4010
  acl release_affinity_present req.hdr(X-MyApp-AI-Release-Affinity) -m found
  acl stable_unavailable nbsrv(ai_stable) eq 0
  acl candidate_available nbsrv(ai_candidate) gt 0
  use_backend %[req.hdr(X-MyApp-AI-Release-Affinity),map(/var/lib/haproxy/ai-router/release-affinity.map,ai_affinity_missing)] if release_affinity_present
  use_backend ai_candidate if stable_unavailable candidate_available
  use_backend %[rand(100),map(/var/lib/haproxy/ai-router/rollout.map,ai_stable)] if candidate_available
  default_backend ai_stable

backend ai_stable
  balance leastconn
  option httpchk
  http-check send meth GET uri /readyz hdr Host ai-orchestrator
  http-check expect status 200
  default-server check inter 3s fastinter 1s downinter 1s fall 2 rise 2 resolvers docker init-addr none
  server-template stable 1-10 ai-orchestrator:4010

backend ai_candidate
  balance leastconn
  option httpchk
  http-check send meth GET uri /readyz hdr Host ai-orchestrator-candidate
  http-check expect status 200
  default-server check inter 3s fastinter 1s downinter 1s fall 2 rise 2 resolvers docker init-addr none
  server-template candidate 1-10 ai-orchestrator-candidate:4010

backend ai_affinity_missing
  http-request deny deny_status 503
